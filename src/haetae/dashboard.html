<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>haetae · live dashboard</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --bd:#2a2f3a; --tx:#e6e9ef; --mut:#9aa3b2;
    --pend:#6b7280; --prog:#3b82f6; --done:#22c55e; --fail:#ef4444;
    --pass:#22c55e; --failc:#ef4444; --skip:#6b7280; --accent:#f59e0b;
    --build:#3b82f6; --verify:#a855f7; --synth:#14b8a6; --replan:#f59e0b; --judge:#a855f7; --exec:#22c55e; --orch:#3b82f6;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif; }
  a { color:var(--prog); }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px;
    border-bottom:1px solid var(--bd); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  .pill { padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .s-running{background:#1e3a8a;color:#bfdbfe} .s-done{background:#14532d;color:#bbf7d0}
  .s-escalated{background:#7c2d12;color:#fed7aa} .s-stopped_budget,.s-stopped_stuck{background:#3f3f46;color:#e4e4e7}
  .mut { color:var(--mut); }
  /* live indicator */
  #live { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; }
  #live .dot { width:8px; height:8px; border-radius:50%; background:var(--mut); }
  #live.live .dot { background:var(--done); box-shadow:0 0 6px var(--done); animation:pulse 1.6s infinite; }
  #live.polling .dot { background:var(--accent); }
  #live.reconnecting .dot { background:var(--accent); animation:blink 1s infinite; }
  #live.offline .dot { background:var(--fail); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
  .grid { display:grid; grid-template-columns: 1fr 360px; gap:14px; padding:14px 18px; align-items:start; }
  @media (max-width:900px){ .grid{ grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--bd); border-radius:10px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin:0 0 10px; }
  .banner { background:#7c2d12; border:1px solid #b45309; color:#fed7aa; padding:10px 14px; border-radius:8px; margin:0 18px 0; }
  /* 현재 활동 */
  .act-card { border-color:#2c3550; background:linear-gradient(180deg,#191e2b,#171a21); }
  .act { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--bd);
    border-left:3px solid var(--prog); border-radius:8px; margin-bottom:8px; background:var(--panel2); }
  .act .spin { width:12px; height:12px; border:2px solid #334; border-top-color:var(--prog); border-radius:50%; animation:rot .8s linear infinite; flex:none; }
  @keyframes rot { to{ transform:rotate(360deg); } }
  .act .u { font-weight:700; font-size:13px; }
  .act .el { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--mut); font-size:12px; }
  /* stage badge */
  .stage { font-size:10px; font-weight:700; padding:1px 7px; border-radius:5px; text-transform:uppercase; letter-spacing:.04em; }
  .stg-build{background:#172554;color:#bfdbfe} .stg-verify{background:#3b0764;color:#e9d5ff}
  .stg-synthesize{background:#042f2e;color:#99f6e4} .stg-scaffold{background:#1c1917;color:#d6d3d1}
  .stg-replan{background:#451a03;color:#fed7aa} .stg-done{background:#14532d;color:#bbf7d0} .stg-escalate{background:#450a0a;color:#fecaca}
  /* DAG */
  #dagwrap { position:relative; overflow:auto; }
  #edges { position:absolute; inset:0; pointer-events:none; z-index:0; }
  .levels { position:relative; z-index:1; display:flex; flex-direction:column; gap:26px; padding:6px 4px; }
  .level { display:flex; gap:16px; flex-wrap:wrap; }
  .node { min-width:150px; max-width:230px; background:var(--panel2); border:1.5px solid var(--bd);
    border-left-width:5px; border-radius:9px; padding:9px 11px; cursor:pointer; transition:.12s; }
  .node:hover { border-color:var(--prog); transform:translateY(-1px); }
  .node.sel { outline:2px solid var(--accent); }
  .node.blocked { box-shadow:0 0 0 1.5px var(--fail) inset; }
  .node.running { box-shadow:0 0 0 1.5px var(--prog) inset; }
  .node .id { font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px; }
  .node .goal { font-size:11.5px; color:var(--mut); margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
  .node .st { font-size:10.5px; font-weight:700; text-transform:uppercase; margin-top:5px; letter-spacing:.05em; }
  .b-pending{border-left-color:var(--pend)} .b-in_progress{border-left-color:var(--prog)}
  .b-done{border-left-color:var(--done)} .b-failed{border-left-color:var(--fail)}
  .t-pending{color:var(--pend)} .t-in_progress{color:var(--prog)} .t-done{color:var(--done)} .t-failed{color:var(--fail)}
  .blk { font-size:11px; color:#fca5a5; margin-top:5px; }
  /* checks */
  .chk { border:1px solid var(--bd); border-radius:7px; padding:8px 10px; margin-bottom:8px; background:var(--panel2); }
  .chk .row { display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; font-weight:700; padding:1px 7px; border-radius:5px; text-transform:uppercase; }
  .ba-pass{background:#14532d;color:#bbf7d0} .ba-fail{background:#7f1d1d;color:#fecaca} .ba-skipped{background:#3f3f46;color:#d4d4d8}
  .ctype { font-size:11px; color:var(--mut); }
  code,.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
  .cmd { display:block; color:#cbd5e1; background:#0b0d11; padding:5px 7px; border-radius:5px; margin-top:6px; white-space:pre-wrap; word-break:break-all; }
  details.ev { margin-top:6px; } details.ev summary { cursor:pointer; font-size:11.5px; color:var(--accent); }
  details.ev[open] summary { margin-bottom:6px; }
  pre.trace { background:#0b0d11; border:1px solid var(--bd); border-radius:6px; padding:8px; max-height:280px;
    overflow:auto; font-size:11px; white-space:pre-wrap; color:#cbd5e1; margin:6px 0 0; }
  .kv { display:flex; gap:6px; font-size:11.5px; flex-wrap:wrap; } .kv b{color:var(--mut);font-weight:600}
  .ev-good{color:var(--done)} .ev-bad{color:var(--fail)}
  /* timelines */
  .tl-row { display:flex; gap:10px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--bd); font-size:12.5px; }
  .tl-row:last-child{border-bottom:0}
  .seq { color:var(--mut); font-variant-numeric:tabular-nums; min-width:26px; }
  .flow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .flow .step { display:flex; align-items:center; gap:5px; padding:3px 8px; border:1px solid var(--bd); border-radius:7px; background:var(--panel2); font-size:11.5px; }
  .flow .arr { color:var(--mut); }
  .flow .ts { color:var(--mut); font-size:10px; font-variant-numeric:tabular-nums; }
  /* cost */
  .cost-total { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin-bottom:10px; }
  .cost-total .big { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .cost-total .usd { font-size:15px; color:var(--done); font-variant-numeric:tabular-nums; }
  .bar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:#0b0d11; margin:8px 0; border:1px solid var(--bd); }
  .bar span { display:block; height:100%; }
  .seg-orchestration{background:var(--orch)} .seg-executor{background:var(--exec)} .seg-judge{background:var(--judge)}
  .seg-mixed{background:#64748b} .seg-unknown{background:#3f3f46}
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:11.5px; margin-top:6px; }
  .legend .lg { display:flex; align-items:center; gap:5px; }
  .legend .sw { width:10px; height:10px; border-radius:3px; }
  .cost-tbl { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .cost-tbl td,.cost-tbl th { text-align:right; padding:3px 6px; border-bottom:1px solid var(--bd); font-variant-numeric:tabular-nums; }
  .cost-tbl th { color:var(--mut); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.05em; }
  .cost-tbl td:first-child,.cost-tbl th:first-child { text-align:left; }
  .gap { font-size:12px; padding:7px 9px; border:1px solid var(--bd); border-left:3px solid var(--accent); border-radius:6px; margin-bottom:8px; background:var(--panel2); }
  .empty { color:var(--mut); font-size:12.5px; }
  #detail .ph { color:var(--mut); font-size:13px; }
  .small { font-size:11.5px; }
  .err { background:#7f1d1d; color:#fecaca; padding:14px; border-radius:8px; margin:14px 0; }
  /* 제어 표면: runs 목록 + 실행 폼 (WO#37) */
  .runs-card { border-color:#2c3550; }
  .runs-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .runs-head h2 { margin:0; }
  .runs-head .sp { flex:1; }
  .btn { font:inherit; font-size:12px; font-weight:600; padding:5px 11px; border-radius:7px;
    border:1px solid var(--bd); background:var(--panel2); color:var(--tx); cursor:pointer; }
  .btn:hover { border-color:var(--prog); }
  .btn.primary { background:#1d4ed8; border-color:#1d4ed8; color:#fff; }
  .btn.danger { background:#7f1d1d; border-color:#b91c1c; color:#fecaca; }
  .btn.danger:hover { background:#991b1b; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .runs-list { display:flex; flex-direction:column; gap:6px; max-height:260px; overflow:auto; }
  .run-row { display:flex; align-items:center; gap:10px; padding:7px 10px; border:1px solid var(--bd);
    border-radius:8px; background:var(--panel2); cursor:pointer; }
  .run-row:hover { border-color:var(--prog); }
  .run-row.sel { outline:2px solid var(--accent); }
  .run-row .rid { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; font-weight:700; }
  .run-row .rorder { color:var(--mut); font-size:11.5px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rbadge { font-size:10px; font-weight:700; padding:1px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }
  .r-running{background:#1e3a8a;color:#bfdbfe} .r-finished{background:#14532d;color:#bbf7d0}
  .r-stopped{background:#3f3f46;color:#e4e4e7} .r-failed{background:#7f1d1d;color:#fecaca} .r-unknown{background:#451a03;color:#fed7aa}
  .run-form { border:1px solid var(--bd); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--panel2); }
  .run-form textarea { width:100%; min-height:64px; resize:vertical; background:#0b0d11; color:var(--tx);
    border:1px solid var(--bd); border-radius:7px; padding:8px; font:inherit; font-size:12.5px; }
  .opts { display:flex; flex-wrap:wrap; gap:10px 16px; margin:10px 0; align-items:center; }
  .opt { display:flex; align-items:center; gap:5px; font-size:12px; }
  .opt label { color:var(--mut); }
  .opt input[type=number], .opt input[type=text], .opt select { background:#0b0d11; color:var(--tx);
    border:1px solid var(--bd); border-radius:6px; padding:3px 6px; font:inherit; font-size:12px; }
  .opt input[type=number] { width:64px; } .opt input[type=text] { width:130px; }
  .form-err { color:#fca5a5; font-size:12px; margin-top:6px; }
  .ctl-off { color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>haetae <span class="mut">· live dashboard</span></h1>
  <span id="status" class="pill mut">…</span>
  <span id="specref" class="mut small"></span>
  <span style="flex:1"></span>
  <span id="live"><span class="dot"></span><span id="live-tx">연결 중…</span></span>
  <span id="tick" class="mut small"></span>
</header>
<div id="banner-slot"></div>
<div id="runs-card" class="card runs-card" style="display:none; margin:14px 18px 0;">
  <div class="runs-head">
    <h2>runs</h2>
    <span id="ctl-state" class="ctl-off"></span>
    <span class="sp"></span>
    <button id="new-run-btn" class="btn primary" style="display:none">+ 새 run</button>
  </div>
  <div id="run-form" class="run-form" style="display:none">
    <textarea id="f-order" placeholder="work order / 주문 원문 (예: '리테일 흐름 시뮬레이션을 만들어라 …')"></textarea>
    <div class="opts">
      <span class="opt"><label>executor</label>
        <select id="f-executor"><option value="codex" selected>codex</option><option value="human">human</option></select></span>
      <span class="opt"><label>max-parallel</label><input id="f-max-parallel" type="number" min="1" max="16" value="4"></span>
      <span class="opt"><label>run-timeout</label><input id="f-run-timeout" type="number" min="1" max="3600" value="120"></span>
      <span class="opt"><label>max-iters</label><input id="f-max-iters" type="number" min="1" max="200" value="30"></span>
      <span class="opt"><label>unit-retries</label><input id="f-unit-retries" type="number" min="0" max="10" value="2"></span>
      <span class="opt"><label>critic-model</label><input id="f-critic-model" type="text" placeholder="(옵션)"></span>
      <span class="opt"><input id="f-scaffold" type="checkbox" checked><label>scaffold</label></span>
      <span class="opt"><input id="f-skills" type="checkbox" checked><label>skills</label></span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="launch-btn" class="btn primary">▶ 실행 (launch)</button>
      <button id="cancel-form-btn" class="btn">취소</button>
      <span id="form-err" class="form-err"></span>
    </div>
  </div>
  <div id="runs-list" class="runs-list"></div>
</div>
<div id="root" class="grid">
  <div id="left">
    <div class="card act-card"><h2>현재 활동 (라이브)</h2><div id="activity"></div></div>
    <div class="card"><h2>유닛 DAG</h2><div id="dagwrap"><svg id="edges"></svg><div id="levels" class="levels"></div></div></div>
    <div class="card"><h2>단계 타임라인 (transitions)</h2><div id="transitions" class="flow"></div></div>
    <div class="card"><h2>검증 · 이벤트 타임라인</h2><div id="timeline"></div></div>
    <div class="card" id="integration-card" style="display:none"><h2>통합 gate (verify · unit=none)</h2><div id="integration"></div></div>
  </div>
  <div id="right">
    <div class="card" id="cost-card"><h2>코스트</h2><div id="cost"></div></div>
    <div class="card"><h2 id="detail-h">상세</h2><div id="detail"><div class="ph">DAG 노드를 클릭하면 work order·gate 체크·실행 증거·비용이 여기에.</div></div></div>
    <div class="card" id="critique-card" style="display:none"><h2>spec critique</h2><div id="critique"></div></div>
    <div class="card" id="esc-card" style="display:none"><h2>pending escalations</h2><div id="esc"></div></div>
  </div>
</div>

<script>
const POLL_MS = __POLL_MS__;
const ALLOW_RUN = __ALLOW_RUN__;   // 제어 표면 활성 여부(--allow-run). off면 폼/stop 숨김.
let SEL = null;       // 선택된 유닛 id
let RUN = null;       // 뷰어가 타겟팅하는 run id (null = 기본 --state-path 뷰)
let VIEW = null;
let es = null;        // 현재 EventSource(타겟 바뀌면 재연결)
let sseConnected = false;
let lastMsg = 0;
const $ = (id) => document.getElementById(id);
const esc = (s) => (s==null?"":String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num = (n) => (n==null? "—" : Number(n).toLocaleString());
const usd = (n) => (n==null? "—" : "$"+Number(n).toFixed(4));
const dur = (s) => { if(s==null) return "—"; s=Math.round(s); if(s<60) return s+"s"; const m=Math.floor(s/60); return m+"m"+(s%60)+"s"; };

function setLive(state, txt){
  const el=$("live"); el.className=state; $("live-tx").textContent=txt;
}

// ── 라이브: SSE 우선, 폴링 폴백 (RUN 타겟이 있으면 ?run=<id>) ──
const runQS = () => (RUN ? "?run="+encodeURIComponent(RUN) : "");
function applyView(v){ VIEW=v; render(v); lastMsg=Date.now(); $("tick").textContent="갱신 "+new Date().toLocaleTimeString(); }

function startSSE(){
  if (es) { try{ es.close(); }catch(_){} es=null; }
  if (!window.EventSource) { setLive("polling","폴링(SSE 미지원)"); return; }
  try {
    es = new EventSource("/api/stream"+runQS());
    es.onopen = ()=>{ sseConnected=true; setLive("live","라이브 (SSE)"); };
    es.onmessage = (e)=>{ sseConnected=true; setLive("live","라이브 (SSE)"); try{ applyView(JSON.parse(e.data)); }catch(_){} };
    es.onerror = ()=>{ sseConnected=false; setLive("reconnecting","재연결 중…"); }; // EventSource가 자동 재연결
  } catch(_) { sseConnected=false; setLive("polling","폴링"); }
}

async function pollOnce(){
  // SSE가 살아 최근 수신했으면 폴백은 쉰다(중복 방지). 끊기면 폴백이 채운다.
  if (sseConnected && (Date.now()-lastMsg) < POLL_MS*3) return;
  try {
    const r = await fetch("/api/state"+runQS(), {cache:"no-store"});
    applyView(await r.json());
    if (!sseConnected) setLive("polling","폴링(폴백)");
  } catch(e) {
    setLive("offline","연결 끊김 — 재시도…");
  }
}

// ── 제어 표면: runs 목록 / 실행 폼 / stop ──
function clearViewer(){
  ["activity","levels","transitions","timeline","integration","cost","critique","esc"].forEach(id=>{ const e=$(id); if(e) e.innerHTML=""; });
}
function selectRun(id){
  RUN = id; SEL = null; VIEW = null;
  document.querySelectorAll(".run-row").forEach(x=>x.classList.toggle("sel", x.dataset.id===id));
  $("ctl-state").textContent = id ? ("보는 중: "+id) : "";
  startSSE(); pollOnce();
}
const RSTAT_KO = {running:"도는 중", finished:"완료", stopped:"정지됨", failed:"실패", unknown:"미상"};
function renderRuns(payload){
  const runs = (payload && payload.runs) || [];
  const card = $("runs-card");
  // 제어 ON이거나 run이 하나라도 있으면 카드 표시(클래식 단일 state 뷰는 깔끔히 숨김).
  if (!ALLOW_RUN && runs.length===0) { card.style.display="none"; return; }
  card.style.display = "block";
  $("new-run-btn").style.display = ALLOW_RUN ? "inline-block" : "none";
  $("ctl-state").textContent = ALLOW_RUN
    ? ($("ctl-state").textContent || "제어 활성")
    : "제어 비활성 (--allow-run으로 켜기)";
  const list = $("runs-list");
  list.innerHTML = runs.length ? runs.map(r=>{
    const st = r.status||"unknown";
    const canStop = ALLOW_RUN && st==="running";
    return '<div class="run-row'+(RUN===r.id?" sel":"")+'" data-id="'+esc(r.id)+'">'
      + '<span class="rid">'+esc(r.id)+'</span>'
      + '<span class="rbadge r-'+esc(st)+'">'+esc(RSTAT_KO[st]||st)+'</span>'
      + '<span class="rorder">'+esc(r.order||"")+'</span>'
      + (canStop ? '<button class="btn danger stop-btn" data-id="'+esc(r.id)+'">정지</button>' : '')
      + '</div>';
  }).join("") : '<div class="empty">아직 run 없음'+(ALLOW_RUN?' — "+ 새 run"으로 시작':'')+'</div>';
  list.querySelectorAll(".run-row").forEach(row=>{
    row.onclick = (e)=>{ if (e.target.classList.contains("stop-btn")) return; selectRun(row.dataset.id); };
  });
  list.querySelectorAll(".stop-btn").forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); stopRun(b.dataset.id, b); };
  });
}
async function loadRuns(){
  try {
    const r = await fetch("/api/runs", {cache:"no-store"});
    renderRuns(await r.json());
  } catch(_) { /* runs 로드 실패는 조용히(뷰어는 계속) */ }
}
async function stopRun(id, btn){
  if (btn){ btn.disabled=true; btn.textContent="정지 중…"; }
  try {
    await fetch("/api/run/"+encodeURIComponent(id)+"/stop", {method:"POST"});
  } catch(_){}
  loadRuns();
}
function showForm(show){
  $("run-form").style.display = show ? "block" : "none";
  $("new-run-btn").style.display = (ALLOW_RUN && !show) ? "inline-block" : "none";
}
async function launchRun(){
  const order = $("f-order").value.trim();
  const errEl = $("form-err"); errEl.textContent="";
  if (!order){ errEl.textContent="order를 입력하세요."; return; }
  const cm = $("f-critic-model").value.trim();
  const options = {
    executor: $("f-executor").value,
    max_parallel: parseInt($("f-max-parallel").value,10),
    run_timeout: parseFloat($("f-run-timeout").value),
    max_iters: parseInt($("f-max-iters").value,10),
    unit_retries: parseInt($("f-unit-retries").value,10),
    scaffold: $("f-scaffold").checked,
    skills: $("f-skills").checked,
  };
  if (cm) options.critic_model = cm;
  const btn = $("launch-btn"); btn.disabled=true; btn.textContent="실행 중…";
  try {
    const r = await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({order, options})});
    const data = await r.json();
    if (!r.ok){ errEl.textContent = (data && data.error) || ("실패 ("+r.status+")"); return; }
    showForm(false); $("f-order").value="";
    await loadRuns();
    selectRun(data.run_id);   // 새 run 뷰로 자동 전환(SSE 라이브)
  } catch(e){ errEl.textContent = "요청 실패: "+e; }
  finally { btn.disabled=false; btn.textContent="▶ 실행 (launch)"; }
}

function render(v) {
  if (v.error) {
    // body를 통째로 갈아엎지 않는다(runs 목록/폼 유지) — 뷰어 영역에만 에러 표시.
    $("banner-slot").innerHTML = '<div class="err">state 로드 실패: '+esc(v.error)
      + (RUN? '' : ' — 왼쪽에서 run을 고르거나 --state-path로 띄우세요.')+'</div>';
    $("status").textContent = "—"; $("status").className = "pill mut";
    clearViewer();
    return;
  }
  const st = $("status"); st.textContent = v.status; st.className = "pill s-"+v.status;
  $("specref").textContent = v.spec.spec_ref + " · v" + v.spec.spec_version + (v.spec.goal? " · "+v.spec.goal : "");
  const bs = $("banner-slot");
  if (v.status==="escalated" || (v.pending_escalations||[]).length) {
    const e0 = (v.pending_escalations||[])[0] || {};
    bs.innerHTML = '<div class="banner">⚠ <b>escalated</b> — '+esc(e0.question||e0.reason||"사람 입력 대기")+'</div>';
  } else bs.innerHTML = "";
  renderActivity(v);
  renderDag(v);
  renderTransitions(v);
  renderTimeline(v);
  renderIntegration(v);
  renderCost(v);
  renderCritique(v);
  renderEsc(v);
  if (SEL) renderDetail(SEL);
}

const STAGE_KO = {build:"코딩", verify:"검증", synthesize:"합성", scaffold:"스캐폴드", replan:"재계획", done:"완료", escalate:"에스컬레이트"};
function stageBadge(stg){
  if(!stg) return "";
  return '<span class="stage stg-'+esc(stg)+'">'+esc(STAGE_KO[stg]||stg)+'</span>';
}

function liveElapsed(a){
  // 서버가 push 시점에 준 elapsed_s를 기준점으로, 수신 후 흐른 시간을 더해 매초 틱.
  if (a.elapsed_s==null) return null;
  return a.elapsed_s + Math.max(0, (Date.now()-lastMsg)/1000);
}
function renderActivity(v) {
  const acts = v.activity||[];
  $("activity").innerHTML = acts.length ? acts.map(a=>
    '<div class="act"><span class="spin"></span><span class="u">'+esc(a.unit||"(전역)")+'</span>'
    + stageBadge(a.stage)
    + '<span class="el">'+dur(liveElapsed(a))+' 경과</span></div>'
  ).join("") : '<div class="empty">지금 도는 작업 없음 (idle)</div>';
}

function renderDag(v) {
  const wrap = $("levels");
  const blockedMap = {}; (v.blocking||[]).forEach(b => blockedMap[b.unit]=b.blocked_by);
  wrap.innerHTML = "";
  (v.dag.levels||[]).forEach(level => {
    const row = document.createElement("div"); row.className="level";
    level.forEach(uid => {
      const n = v.dag.nodes.find(x=>x.id===uid) || {id:uid,state:"pending",goal:null,deps:[],stage:null};
      const d = document.createElement("div");
      d.className = "node b-"+n.state + (SEL===uid?" sel":"") + (blockedMap[uid]?" blocked":"") + (n.stage?" running":"");
      d.dataset.id = uid;
      const blk = blockedMap[uid] ? '<div class="blk">⛔ blocked by '+esc(blockedMap[uid].join(", "))+'</div>' : "";
      d.innerHTML = '<div class="id">'+esc(uid)+(n.stage?stageBadge(n.stage):"")+'</div>'
        + '<div class="goal">'+esc(n.goal||"")+'</div>'
        + '<div class="st t-'+n.state+'">'+esc(n.state)+'</div>'+blk;
      d.onclick = () => { SEL=uid; renderDetail(uid); document.querySelectorAll(".node").forEach(x=>x.classList.toggle("sel", x.dataset.id===uid)); };
      row.appendChild(d);
    });
    wrap.appendChild(row);
  });
  requestAnimationFrame(()=>drawEdges(v));
}

function drawEdges(v) {
  const svg = $("edges"); const wrap = $("dagwrap");
  const W = wrap.scrollWidth, H = wrap.scrollHeight;
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const base = wrap.getBoundingClientRect();
  const pos = {};
  document.querySelectorAll(".node").forEach(el=>{
    const r = el.getBoundingClientRect();
    pos[el.dataset.id] = {x:r.left-base.left+wrap.scrollLeft+r.width/2, top:r.top-base.top+wrap.scrollTop, bot:r.top-base.top+wrap.scrollTop+r.height};
  });
  let p = "";
  (v.dag.edges||[]).forEach(e=>{
    const a=pos[e.from], b=pos[e.to]; if(!a||!b) return;
    const x1=a.x,y1=a.bot,x2=b.x,y2=b.top, my=(y1+y2)/2;
    p += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="#2a2f3a" stroke-width="1.5"/>`;
  });
  svg.innerHTML = p;
}

function tsShort(ts){ if(!ts) return ""; const m=String(ts).match(/T(\d\d:\d\d:\d\d)/); return m?m[1]:String(ts); }

function renderTransitions(v) {
  const tr = v.transitions||[];
  if (!tr.length) { $("transitions").innerHTML = '<div class="empty">단계 이력 없음</div>'; return; }
  $("transitions").innerHTML = tr.map((t,i)=>
    (i? '<span class="arr">→</span>':"")
    + '<span class="step">'+stageBadge(t.stage)+(t.unit?'<span class="mono">'+esc(t.unit)+'</span>':"")
    + '<span class="ts">'+esc(tsShort(t.ts))+'</span></span>'
  ).join("");
}

function checkHtml(c) {
  const ev = c.run_evidence;
  let evHtml = "";
  if (ev) {
    const ok = ev.booted ? '<span class="ev-good">booted ✓</span>' : '<span class="ev-bad">booted ✗</span>';
    evHtml = '<details class="ev"><summary>run 증거 ('+(ev.booted?'booted':'not booted')+', exit '+esc(ev.exit_code)+')</summary>'
      + '<div class="kv"><b>booted</b> '+ok+' &nbsp;<b>exit</b> '+esc(ev.exit_code)+' &nbsp;<b>timeout</b> '+esc(ev.timed_out)+' &nbsp;<b>dur</b> '+esc(ev.duration_s)+'s</div>'
      + (ev.reason? '<div class="kv"><b>reason</b> '+esc(ev.reason)+'</div>':'')
      + (ev.trace? '<pre class="trace">'+esc(ev.trace)+'</pre>':'')
      + (ev.stderr_tail? '<div class="kv small"><b>stderr</b></div><pre class="trace">'+esc(ev.stderr_tail)+'</pre>':'')
      + '</details>';
  }
  return '<div class="chk"><div class="row"><span class="badge ba-'+esc(c.status)+'">'+esc(c.status)+'</span>'
    + '<span class="mono">'+esc(c.ac_id)+'</span><span class="ctype">'+esc(c.check_type)+(c.exit_code!=null?' · exit '+esc(c.exit_code):'')+'</span></div>'
    + (c.cmd? '<code class="cmd">'+esc(c.cmd)+'</code>':'')
    + (c.detail? '<details class="ev"><summary>detail</summary><pre class="trace">'+esc(c.detail)+'</pre></details>':'')
    + evHtml + '</div>';
}

function costLine(c){
  if(!c) return "";
  const src = c.source? '<span class="stage stg-'+esc(c.source==="judge"?"verify":(c.source==="executor"?"done":"build"))+'">'+esc(c.source)+'</span> ' : "";
  return '<div class="kv" style="margin-top:8px"><b>cost</b> '+src+num(c.tokens)+' tok · '+usd(c.usd)+'</div>';
}

function renderDetail(uid) {
  const u = (VIEW.units||{})[uid];
  $("detail-h").textContent = "상세 · " + uid;
  if (!u) { $("detail").innerHTML = '<div class="ph">데이터 없음</div>'; return; }
  let h = '<div class="kv"><b>state</b> <span class="t-'+u.state+'">'+esc(u.state)+'</span>';
  if (u.stage) h += ' '+stageBadge(u.stage);
  if (u.verdict) h += ' &nbsp;<b>verdict</b> '+esc(u.verdict);
  h += '</div>';
  h += costLine(u.cost);
  if (u.work_order_ref) h += '<p class="small" style="margin:8px 0"><b class="mut">work order</b><br>'+esc(u.work_order_ref)+'</p>';
  const blk = (VIEW.blocking||[]).find(b=>b.unit===uid);
  if (blk) h += '<div class="gap" style="border-left-color:var(--fail)">⛔ blocked by <b>'+esc(blk.blocked_by.join(", "))+'</b> (미완료 의존)</div>';
  h += '<h2 style="margin-top:12px">gate checks ('+u.checks.length+')</h2>';
  h += u.checks.length ? u.checks.map(checkHtml).join("") : '<div class="empty">체크 없음</div>';
  $("detail").innerHTML = h;
}

function renderTimeline(v) {
  $("timeline").innerHTML = (v.timeline||[]).map(t=>{
    const vd = t.verdict||"—";
    const cls = vd==="pass"||vd==="done"?"t-done":(vd&&vd.indexOf("fail")===0?"t-failed":"mut");
    return '<div class="tl-row"><span class="seq">#'+t.seq+'</span><span class="mono">'+esc(t.unit||"(integration)")+'</span>'
      + '<span class="'+cls+'">'+esc(vd)+'</span><span class="mut small">'+t.n_checks+' checks</span>'
      + '<span class="mut small" style="flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.work_order_ref||"")+'</span></div>';
  }).join("") || '<div class="empty">이벤트 없음</div>';
}

function renderIntegration(v) {
  const ints = v.integration||[];
  $("integration-card").style.display = ints.length? "block":"none";
  $("integration").innerHTML = ints.map(it=>{
    const fails = it.checks.filter(c=>c.status==="fail").length;
    return '<div class="gap" style="border-left-color:'+(fails?'var(--fail)':'var(--done)')+'">'
      + '<div class="kv"><b>seq</b> #'+it.seq+' &nbsp;<b>verdict</b> '+esc(it.verdict)+' &nbsp;<b>checks</b> '+it.checks.length+' ('+fails+' fail)</div></div>'
      + it.checks.map(checkHtml).join("");
  }).join("");
}

const SRC_KO = {orchestration:"오케스트레이션", executor:"실행자(codex)", judge:"검증(judge)", mixed:"혼합", unknown:"미상"};
function renderCost(v) {
  const c = v.cost; if(!c){ $("cost").innerHTML='<div class="empty">비용 데이터 없음</div>'; return; }
  const t = c.total||{};
  let h = '<div class="cost-total"><span class="big">'+num(t.tokens)+'</span><span class="mut small">tokens</span>'
    + '<span class="usd">'+usd(t.usd)+'</span>';
  if (t.usd==null) h += '<span class="mut small">(usd 미상 — tokens only)</span>';
  if (c.cap && c.cap.usd!=null) h += '<span class="mut small">/ cap '+usd(c.cap.usd)+'</span>';
  h += '</div>';
  if (t.input!=null||t.output!=null) h += '<div class="kv mut small">in '+num(t.input)+' · out '+num(t.output)+'</div>';

  // source별 막대 + 범례 (tokens 기준)
  const bs = c.by_source||{};
  const srcs = Object.keys(bs);
  const tot = srcs.reduce((s,k)=> s+(bs[k].tokens||0), 0);
  if (tot>0) {
    h += '<div class="bar">'+srcs.map(k=>{ const w=((bs[k].tokens||0)/tot*100).toFixed(1); return '<span class="seg-'+esc(k)+'" style="width:'+w+'%"></span>'; }).join("")+'</div>';
    h += '<div class="legend">'+srcs.map(k=>'<span class="lg"><span class="sw seg-'+esc(k)+'"></span>'+esc(SRC_KO[k]||k)+' '+num(bs[k].tokens)+(bs[k].usd!=null?' / '+usd(bs[k].usd):'')+'</span>').join("")+'</div>';
  } else if (srcs.length) {
    h += '<div class="legend">'+srcs.map(k=>'<span class="lg"><span class="sw seg-'+esc(k)+'"></span>'+esc(SRC_KO[k]||k)+' '+num(bs[k].tokens)+'</span>').join("")+'</div>';
  } else {
    h += '<div class="empty">귀속된 비용 없음</div>';
  }

  // unit별 표
  const bu = c.by_unit||{}; const units = Object.keys(bu);
  if (units.length) {
    h += '<table class="cost-tbl"><tr><th>unit</th><th>tokens</th><th>usd</th></tr>'
      + units.map(u=>'<tr><td>'+esc(u)+'</td><td>'+num(bu[u].tokens)+'</td><td>'+usd(bu[u].usd)+'</td></tr>').join("")
      + '</table>';
  }
  $("cost").innerHTML = h;
}

function renderCritique(v) {
  const c = v.spec_critique;
  $("critique-card").style.display = c? "block":"none";
  if (!c) return;
  let h = '<div class="kv"><b>verdict</b> <span class="'+(c.verdict==="soft"?"t-failed":"t-done")+'">'+esc(c.verdict)+'</span>'
    + (c.resynthesized? ' &nbsp;<span class="mut small">(재합성됨)</span>':'')+'</div>';
  if (c.note) h += '<p class="small mut" style="margin:6px 0">'+esc(c.note)+'</p>';
  h += (c.gaps||[]).map(g=>'<div class="gap"><b>'+esc(g.area)+'</b>'
    + (g.cheap_path? '<br><span class="mut">cheap:</span> '+esc(g.cheap_path):'')
    + (g.strengthening? '<br><span class="mut">강화:</span> '+esc(g.strengthening):'')+'</div>').join("");
  $("critique").innerHTML = h;
}

function renderEsc(v) {
  const es = v.pending_escalations||[];
  $("esc-card").style.display = es.length? "block":"none";
  $("esc").innerHTML = es.map(e=>'<div class="gap" style="border-left-color:var(--fail)">'
    + esc(e.question||e.reason||JSON.stringify(e))
    + (e.why_now? '<br><span class="mut small">왜 지금: '+esc(e.why_now)+'</span>':'')+'</div>').join("");
}

// 제어 표면 이벤트 배선(폼 토글 / launch / stop은 위임으로).
$("new-run-btn").onclick = ()=>showForm(true);
$("cancel-form-btn").onclick = ()=>{ showForm(false); $("form-err").textContent=""; };
$("launch-btn").onclick = launchRun;

// 부팅: 즉시 1회 폴링(첫 페인트) → SSE 구독 → 폴링 폴백 인터벌(SSE 살면 자동 휴면).
setLive("reconnecting","연결 중…");
pollOnce();
startSSE();
loadRuns();
setInterval(pollOnce, POLL_MS);
setInterval(loadRuns, Math.max(2000, POLL_MS));   // runs 상태 배지 주기 갱신
// 경과시간이 SSE 갱신 사이에도 흐르게 보이도록 활동 패널만 1s마다 다시 그림.
setInterval(()=>{ if (VIEW && !VIEW.error) renderActivity(VIEW); }, 1000);
</script>
